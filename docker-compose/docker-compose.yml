name: fcg-demo

x-rabbit-config: &rabbit-config
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: /
  RabbitMq__Username: ${RABBITMQ_USER}
  RabbitMq__Password: ${RABBITMQ_PASSWORD}

x-users-config: &users-config
  <<: *rabbit-config
  DOTNET_ENVIRONMENT: Development
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__UsersDatabase: "Host=postgres;Port=5432;Database=${USERS_DB_NAME};Username=${USERS_DB_USER};Password=${USERS_DB_PASSWORD};Include Error Detail=false"
  Jwt__Issuer: FIAP.CloudGames
  Jwt__Audience: FIAP.CloudGames.Api
  Jwt__AccessTokenExpirationMinutes: "15"
  Jwt__RefreshTokenExpirationDays: "7"
  Jwt__Signing__ActiveKeyId: users-demo-v1
  Jwt__Signing__PrivateKeyPath: /data/jwt/private.pem
  Jwt__Validation__Keys__0__KeyId: users-demo-v1
  Jwt__Validation__Keys__0__PublicKeyPath: /data/jwt/public.pem
  RabbitMq__UseTls: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # Repassadas ao script init-db/01-create-databases.sh
      USERS_DB_NAME: ${USERS_DB_NAME}
      USERS_DB_USER: ${USERS_DB_USER}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME}
      CATALOG_DB_USER: ${CATALOG_DB_USER}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME}
      PAYMENTS_DB_USER: ${PAYMENTS_DB_USER}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      NOTIFICATIONS_DB_NAME: ${NOTIFICATIONS_DB_NAME}
      NOTIFICATIONS_DB_USER: ${NOTIFICATIONS_DB_USER}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - fcg-interna

  rabbitmq:
    image: rabbitmq@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${FCG_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - fcg-interna

  usersapi:
    image: ${USERS_IMAGE}
    environment:
      <<: *users-config
      DemonstracaoLocal__Habilitada: "true"
      ASPNETCORE_HTTP_PORTS: "8080"
      Swagger__Enabled: "true"
      Outbox__Enabled: "true"
      Jwt__PublicKeyExport__Path: /data/jwt-publica/public.pem
    ports:
      - "127.0.0.1:${FCG_USERS_HTTP_PORT:-5088}:8080"
    volumes:
      - jwt-chaves:/data/jwt
      - jwt-publica:/data/jwt-publica
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fcg-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  catalogapi:
    image: ${CATALOG_IMAGE}
    restart: unless-stopped
    environment:
      <<: *rabbit-config
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__CatalogDatabase: "Host=postgres;Port=5432;Database=${CATALOG_DB_NAME};Username=${CATALOG_DB_USER};Password=${CATALOG_DB_PASSWORD}"
      DemonstracaoLocal__Habilitada: "true"
      Jwt__Issuer: FIAP.CloudGames
      Jwt__Audience: FIAP.CloudGames.Api
      Jwt__PublicKeys__0__Kid: users-demo-v1
      Jwt__PublicKeys__0__PublicKeyPath: /data/jwt-publica/public.pem
    volumes:
      - type: volume
        source: jwt-publica
        target: /data/jwt-publica
        read_only: true
        volume:
          nocopy: true
    ports:
      - "127.0.0.1:${FCG_CATALOG_HTTP_PORT:-5081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      usersapi:
        condition: service_healthy
    networks:
      - fcg-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  paymentsapi:
    image: ${PAYMENTS_IMAGE}
    restart: unless-stopped
    environment:
      <<: *rabbit-config
      RabbitMq__Host: "rabbitmq://rabbitmq"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      DemonstracaoLocal__Habilitada: "true"
      ConnectionStrings__PaymentsDatabase: "Host=postgres;Port=5432;Database=${PAYMENTS_DB_NAME};Username=${PAYMENTS_DB_USER};Password=${PAYMENTS_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${FCG_PAYMENTS_HTTP_PORT:-5082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  notificationsapi:
    image: ${NOTIFICATIONS_IMAGE}
    restart: unless-stopped
    environment:
      <<: *rabbit-config
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__NotificationsDatabase: "Host=postgres;Port=5432;Database=${NOTIFICATIONS_DB_NAME};Username=${NOTIFICATIONS_DB_USER};Password=${NOTIFICATIONS_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${FCG_API4_HTTP_PORT:-5083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fcg-interna:
    driver: bridge

volumes:
  postgres-dados:
  rabbitmq-dados:
  jwt-chaves:
  jwt-publica:
