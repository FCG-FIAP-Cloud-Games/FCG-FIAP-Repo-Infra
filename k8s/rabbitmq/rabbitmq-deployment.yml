apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fcg-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
    envFrom:
      - configMapRef:
          name: fcg-config
    env:
      - name: RabbitMq__Username
        valueFrom:
          secretKeyRef:
            name: fcg-secrets
            key: RABBITMQ_USER
      - name: RabbitMq__Password
        valueFrom:
          secretKeyRef:
            name: fcg-secrets
            key: RABBITMQ_PASSWORD
      - name: USERS_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: fcg-secrets
            key: USERS_DB_PASSWORD
      - name: ConnectionStrings__UsersDatabase
        value: "Host=postgres;Port=5432;Database=$(USERS_DB_NAME);Username=$(USERS_DB_USER);Password=$(USERS_DB_PASSWORD);Include Error Detail=false"

        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "check_running"]
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fcg-demo
spec:
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
  selector:
    app: rabbitmq