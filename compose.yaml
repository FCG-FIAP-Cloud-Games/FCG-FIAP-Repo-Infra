
name: fcg-demo

x-users-config: &users-config
  DOTNET_ENVIRONMENT: Development
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__UsersDatabase: "Host=postgres;Port=5432;Database=fcg_users_demo;Username=fcg_users_demo;Password=UsersDb_Demo_2026!;Include Error Detail=false"
  Jwt__Issuer: FIAP.CloudGames
  Jwt__Audience: FIAP.CloudGames.Api
  Jwt__AccessTokenExpirationMinutes: "15"
  Jwt__RefreshTokenExpirationDays: "7"
  Jwt__Signing__ActiveKeyId: users-demo-v1
  Jwt__Signing__PrivateKeyPath: /data/jwt/private.pem
  Jwt__Validation__Keys__0__KeyId: users-demo-v1
  Jwt__Validation__Keys__0__PublicKeyPath: /data/jwt/public.pem
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: /
  RabbitMq__Username: fcg_demo
  RabbitMq__Password: "Rabbit_Demo_2026!"
  RabbitMq__UseTls: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fcg_users_demo
      POSTGRES_USER: fcg_users_demo
      POSTGRES_PASSWORD: "UsersDb_Demo_2026!"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg_users_demo -d fcg_users_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - fcg-interna

  rabbitmq:
    image: rabbitmq@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fcg_demo
      RABBITMQ_DEFAULT_PASS: "Rabbit_Demo_2026!"
    ports:
      - "127.0.0.1:${FCG_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - fcg-interna

  usersapi:
    image: fgcprojetofiap/users-api:1.3
    environment:
      <<: *users-config
      DemonstracaoLocal__Habilitada: "true"
      ASPNETCORE_HTTP_PORTS: "8080"
      Swagger__Enabled: "true"
      Outbox__Enabled: "true"
    ports:
      - "127.0.0.1:${FCG_USERS_HTTP_PORT:-5088}:8080"
    volumes:
      - jwt-chaves:/data/jwt
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fcg-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  catalogapi:
    image: fgcprojetofiap/catalog-api:1.0
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "127.0.0.1:${FCG_CATALOG_HTTP_PORT:-5081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  paymentsapi:
    image: fgcprojetofiap/payments-api:1.0
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "127.0.0.1:${FCG_PAYMENTS_HTTP_PORT:-5082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  notificationsapi:
    image: fgcprojetofiap/notifications-api:1.0.2
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: fcg_demo
      RabbitMq__Password: "Rabbit_Demo_2026!"
    ports:
      - "127.0.0.1:${FCG_API4_HTTP_PORT:-5083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fcg-interna:
    driver: bridge

volumes:
  postgres-dados:
  rabbitmq-dados:
  jwt-chaves:
