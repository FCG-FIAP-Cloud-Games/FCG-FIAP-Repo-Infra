apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentsapi
  namespace: fcg-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentsapi
  template:
    metadata:
      labels:
        app: paymentsapi
    spec:
      containers:
        - name: paymentsapi
          image: fgcprojetofiap/payments-api:1.2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: fcg-config

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development

            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"

            - name: DemonstracaoLocal__Habilitada
              value: "true"

            - name: RabbitMq__Host
              value: "rabbitmq://rabbitmq"

            - name: RabbitMq__Port
              value: "5672"

            - name: RabbitMq__VirtualHost
              value: "/"

            - name: RabbitMq__UseTls
              value: "false"

            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_USER

            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_PASSWORD

            - name: PAYMENTS_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: fcg-config
                  key: PAYMENTS_DB_NAME

            - name: PAYMENTS_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: fcg-config
                  key: PAYMENTS_DB_USER

            - name: PAYMENTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: PAYMENTS_DB_PASSWORD

            - name: ConnectionStrings__PaymentsDatabase
              value: "Host=postgres;Port=5432;Database=$(PAYMENTS_DB_NAME);Username=$(PAYMENTS_DB_USER);Password=$(PAYMENTS_DB_PASSWORD);Include Error Detail=false"

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          terminationMessagePolicy: File

      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: paymentsapi
  namespace: fcg-demo
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: paymentsapi
